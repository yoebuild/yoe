name: Machine Build

# Full from-source build of dev-image for every hardware machine yoe
# supports: the bootstrap toolchain, libc, busybox, the board's kernel and
# bootloader, and image assembly. This is the board-coverage tier -- it
# catches a BSP unit, kernel defconfig, or partition layout that stopped
# building, which the QEMU matrix cannot see.
#
# The QEMU machines (qemu-x86_64, qemu-arm64) are deliberately absent here:
# E2E Build (e2e-build.yaml) already covers them across all three distros
# and boots each image, which is stronger signal than a build alone.
#
# Every board here is arm64, so each cell runs on an arm64 runner and builds
# natively -- no cross-compilation and no QEMU user-mode emulation in the
# build path. Each cell surfaces as its own CI check, e.g.
# "Machine Build (beagleplay / alpine)".
#
# Each cell carries its own distro key rather than sharing one default,
# because distro coverage is a board property. raspberrypi5 and beagleplay
# build all three distros (alpine, debian, ubuntu) so the glibc BSP paths --
# kernel packaging, bootloader install, partition layout on a dpkg rootfs --
# get the same nightly signal the musl path does. raspberrypi4 stays
# alpine-only: it shares its BSP units with raspberrypi5, so the extra cells
# would re-test the same code on a second board. A machine whose kernel and
# board packages come from a vendor apt feed (the Arduino UNO Q's, for
# example) can only build the distro that feed is ABI-coupled to, and it
# should say so next to the board it applies to.
#
# There is no boot test: these images target physical boards, and QEMU
# cannot stand in for them. Each cell verifies the image artifact exists,
# reports its partition table, and uploads the image (zstd-compressed) so a
# nightly build can be downloaded and flashed to real hardware.
on:
  schedule:
    # Offset from E2E Build (06:00 UTC) so the two nightlies don't contend
    # for runners.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  machine-build:
    name: Machine Build (${{ matrix.machine }} / ${{ matrix.distro }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      # Surface every board's failure independently rather than cancelling
      # siblings on the first red cell.
      fail-fast: false
      matrix:
        # Every cell spells out its machine, distro, and runner, so the
        # distro coverage a board gets is visible next to the board rather
        # than implied by a default plus an exclude list.
        include:
          - machine: raspberrypi4
            distro: alpine
            runner: ubuntu-24.04-arm
          - machine: raspberrypi5
            distro: alpine
            runner: ubuntu-24.04-arm
          - machine: raspberrypi5
            distro: debian
            runner: ubuntu-24.04-arm
          - machine: raspberrypi5
            distro: ubuntu
            runner: ubuntu-24.04-arm
          - machine: beagleplay
            distro: alpine
            runner: ubuntu-24.04-arm
          - machine: beagleplay
            distro: debian
            runner: ubuntu-24.04-arm
          - machine: beagleplay
            distro: ubuntu
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # A cold from-source build (toolchain, kernel, cache, container
          # image) needs more headroom than the runner ships with. The Android
          # SDK and CodeQL caches only exist on the x86_64 runner image, so
          # tolerate their absence on arm64.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Enable unprivileged user namespaces
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
          # which makes bwrap inside the build container fail with "setting up
          # uid map: Permission denied" even though the container is
          # --privileged.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build yoe
        run: |
          VERSION=$(git describe --tags HEAD 2>/dev/null || echo "dev")
          go build -ldflags "-X main.version=${VERSION}" -o yoe ./cmd/yoe

      # Every cell restores one cache shared by the whole matrix: synced
      # modules and fetched sources, all keyed by URL or content, so the
      # union of what every cell needs is safe to hand to each of them. One
      # union is a fraction of the size of seven per-cell copies, which
      # together overran the repository's cache quota and got evicted --
      # leaving a cell to re-clone from a host that may be down that night
      # (git.ti.com, for one) with no cached copy to fall back on.
      #
      # Cells only restore. If each also saved under one key, the first cell
      # to finish would win and the slower cells' fetches would never land,
      # so instead each cell uploads what it added (below) and the
      # save-cache job folds those into the next union.
      - name: Restore shared yoe cache
        uses: actions/cache/restore@v4
        with:
          path: testdata/e2e-project/cache
          key: yoe-machine-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            yoe-machine-cache-

      - name: Mark cache restore time
        run: touch "$RUNNER_TEMP/cache-restored"

      # The build's implicit module sync only clones missing modules; it does
      # not advance an already-cached module to the latest commit on its branch
      # ref. Since the build cache (restored above) persists module checkouts
      # across runs, a branch-pinned module would stay frozen at whatever
      # commit it was first cloned at. An explicit sync fast-forwards every
      # cached module to its pinned ref before building.
      - name: Sync modules
        working-directory: testdata/e2e-project
        run: ../../yoe module sync

      - name: Build dev-image
        working-directory: testdata/e2e-project
        run: ../../yoe build -j "$(nproc)" --distro ${{ matrix.distro }} --machine ${{ matrix.machine }} dev-image

      # Runs even when the build failed: a source fetched before the failure
      # is still worth keeping, and a cell that dies on one unit should not
      # have to re-fetch everything else the next night.
      - name: Collect cache delta
        if: ${{ !cancelled() }}
        working-directory: testdata/e2e-project
        run: |
          # Everything written under cache/ since the restore: new clones and
          # archives, plus files a fetch or module sync rewrote in place.
          # Deletions are not carried; nothing in the cache deletes entries
          # during a build.
          out="$RUNNER_TEMP/cache-delta-${{ matrix.machine }}-${{ matrix.distro }}.tar"
          find cache ! -type d -newer "$RUNNER_TEMP/cache-restored" -print0 \
            | tar --null -T - -cf "$out"
          ls -lh "$out"

      - name: Upload cache delta
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cache-delta-${{ matrix.machine }}-${{ matrix.distro }}
          path: ${{ runner.temp }}/cache-delta-${{ matrix.machine }}-${{ matrix.distro }}.tar
          # Mostly git packs and package archives, already compressed.
          compression-level: 0
          # Consumed by save-cache in this same run.
          retention-days: 1
          if-no-files-found: error

      - name: Verify image artifact
        working-directory: testdata/e2e-project
        run: |
          img=build/${{ matrix.distro }}/dev-image.${{ matrix.machine }}/destdir/dev-image.img
          if [ ! -s "$img" ]; then
            echo "::error::dev-image build produced no image at $img"
            exit 1
          fi
          ls -lh "$img"
          # Report the partition layout. A board image is only useful if its
          # boot and root partitions landed where the machine descriptor says,
          # and this is the closest check available without the hardware.
          sfdisk --list "$img" || true

      - name: Compress image
        working-directory: testdata/e2e-project
        run: |
          # A dev-image is a couple of GB of mostly-empty filesystem, which
          # zstd reduces by roughly 9x in a second or two -- worth doing before
          # it crosses the network. Decompress with `unzstd` (or `zstd -d`)
          # before flashing; `yoe flash` takes the decompressed .img.
          # zstd ships on the runner images, but do not let a two-hour build
          # go red at the last step if that ever changes.
          command -v zstd >/dev/null || sudo apt-get install -y --no-install-recommends zstd
          img=build/${{ matrix.distro }}/dev-image.${{ matrix.machine }}/destdir/dev-image.img
          out=dev-image-${{ matrix.machine }}-${{ matrix.distro }}.img.zst
          zstd -3 -T0 -f -o "$out" "$img"
          ls -lh "$out"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-image-${{ matrix.machine }}-${{ matrix.distro }}
          path: testdata/e2e-project/dev-image-${{ matrix.machine }}-${{ matrix.distro }}.img.zst
          # Already zstd-compressed, so skip the action's own zip pass.
          compression-level: 0
          # These are nightly regression builds, not releases. A week is long
          # enough to grab one and flash a board; keeping every night's seven
          # images indefinitely would grow without bound.
          retention-days: 7
          if-no-files-found: error

  # Folds every cell's cache delta into the previous union and saves the
  # result as the next run's shared cache. Overlaying is safe because the
  # cache is keyed by URL or content: two cells that fetched the same thing
  # wrote the same files.
  save-cache:
    name: Save shared cache
    needs: machine-build
    # A red cell still uploaded its delta, and the union should keep it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      # Deleting the superseded union.
      actions: write
    env:
      KEY: yoe-machine-cache-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Restore shared yoe cache
        uses: actions/cache/restore@v4
        with:
          path: testdata/e2e-project/cache
          key: ${{ env.KEY }}
          restore-keys: |
            yoe-machine-cache-

      - name: Download cache deltas
        uses: actions/download-artifact@v4
        with:
          pattern: cache-delta-*
          path: ${{ runner.temp }}/deltas
          merge-multiple: true

      - name: Apply cache deltas
        run: |
          mkdir -p testdata/e2e-project
          for t in "$RUNNER_TEMP"/deltas/*.tar; do
            echo "applying $(basename "$t")"
            tar -xf "$t" -C testdata/e2e-project
          done
          du -sh testdata/e2e-project/cache

      - name: Save shared yoe cache
        uses: actions/cache/save@v4
        with:
          path: testdata/e2e-project/cache
          key: ${{ env.KEY }}

      # Keep exactly one union. Every run saves a new key, and leaving the
      # old ones for LRU eviction would put them in competition with the
      # E2E Build caches for the same quota.
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          keys=$(gh cache list --key yoe-machine-cache- --limit 100 --json key --jq '.[].key')
          # cache/save only warns when it cannot save, so confirm the new
          # union exists before dropping the one it replaces.
          if ! grep -qx "$KEY" <<<"$keys"; then
            echo "::error::$KEY was not saved; keeping the previous cache"
            exit 1
          fi
          grep -vx "$KEY" <<<"$keys" | xargs -r -n1 gh cache delete
