# Point Simple IoT at the provisioning directory this package ships.
#
# Without this, provisioning looks in ${SIOT_DATA}/provisioning, which is
# runtime state and so cannot carry files laid down by an image. The drop-in
# comes from simpleiot-config rather than from simpleiot.service itself, so
# the directory is named only on a device that has files in it.
[Service]
Environment=SIOT_PROVISIONING_DIR=/etc/simpleiot/provisioning
